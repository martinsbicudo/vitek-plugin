name: PR Tests Check 🧪

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

jobs:
  test_check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vite: ["^7.0.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Pin Vite version (matrix)
        run: pnpm add -D vite@${{ matrix.vite }} --no-save

      - name: Run tests
        run: pnpm test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-vite-${{ matrix.vite }}
          path: coverage/
          retention-days: 7

  test_check_vite6_best_effort:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Pin Vite 6 (best-effort)
        run: pnpm add -D vite@^6.0.0 --no-save

      - name: Run unit tests (best-effort)
        run: pnpm test

  examples_check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vite: ["^7.0.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Pin Vite version (matrix)
        run: pnpm add -D vite@${{ matrix.vite }} --no-save

      - name: Build plugin
        run: pnpm run build

      - name: Build and test examples
        run: pnpm run examples:build-and-test
        timeout-minutes: 10

      - name: Build and test showcases
        run: pnpm run showcases:build-and-test
        timeout-minutes: 12

      - name: Run e2e test
        run: pnpm run test:e2e
        timeout-minutes: 3

      - name: Run e2e WebSocket test
        run: pnpm run test:e2e:socket
        timeout-minutes: 3

      - name: Run example benchmark
        run: pnpm run example:bench
        timeout-minutes: 5
